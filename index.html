<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#080c18">
<meta name="description" content="폴리마켓 실시간 이슈·베팅 확률·24시간 거래량·급변동을 한눈에 보는 세상물정 스캐너">
<title>세상물정 스캐너 · Polymarket 실시간 이슈</title>
<style>
  :root{
    --bg:#080c18;
    --bg2:#0b1224;
    --panel:rgba(255,255,255,.045);
    --panel-2:rgba(255,255,255,.028);
    --line:rgba(255,255,255,.085);
    --line-strong:rgba(255,255,255,.16);
    --text:#eaf0ff;
    --muted:#8d9bbd;
    --muted-2:#66739a;
    --accent:#6f8cff;
    --accent-2:#a87bff;
    --up:#2ee6a8;
    --down:#ff6b81;
    --warn:#ffb454;
    --radius:18px;
    --shadow:0 18px 44px -22px rgba(0,0,0,.85);
    --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","맑은 고딕",system-ui,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    line-height:1.45;
    letter-spacing:-.012em;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  body::before,body::after{
    content:"";position:fixed;z-index:0;pointer-events:none;filter:blur(60px);opacity:.55;
  }
  body::before{
    width:520px;height:520px;left:-160px;top:-200px;border-radius:50%;
    background:radial-gradient(circle,rgba(90,120,255,.45),transparent 68%);
  }
  body::after{
    width:600px;height:600px;right:-220px;top:120px;border-radius:50%;
    background:radial-gradient(circle,rgba(150,90,255,.30),transparent 70%);
  }
  .wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 18px 56px}

  /* ---------- header ---------- */
  .topbar{
    position:sticky;top:0;z-index:40;
    backdrop-filter:blur(16px) saturate(150%);
    -webkit-backdrop-filter:blur(16px) saturate(150%);
    background:linear-gradient(180deg,rgba(8,12,24,.92),rgba(8,12,24,.72));
    border-bottom:1px solid var(--line);
  }
  .topbar-in{max-width:1180px;margin:0 auto;padding:13px 18px;display:flex;align-items:center;gap:14px}
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .logo{
    width:38px;height:38px;flex:0 0 38px;border-radius:12px;
    display:grid;place-items:center;font-size:19px;
    background:linear-gradient(145deg,#4d6bff,#9b5cff);
    box-shadow:0 8px 22px -8px rgba(110,110,255,.9), inset 0 1px 0 rgba(255,255,255,.28);
  }
  .brand h1{margin:0;font-size:16.5px;font-weight:800;letter-spacing:-.03em;white-space:nowrap}
  .brand p{margin:1px 0 0;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .updated{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.3;white-space:nowrap}
  .updated b{display:block;color:#c9d6f5;font-weight:600;font-size:12px}
  .iconbtn{
    width:40px;height:40px;border-radius:12px;border:1px solid var(--line-strong);
    background:rgba(255,255,255,.06);color:var(--text);font-size:16px;cursor:pointer;
    display:grid;place-items:center;transition:transform .18s,background .18s,border-color .18s;
  }
  .iconbtn:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28)}
  .iconbtn:active{transform:scale(.94)}
  .iconbtn[aria-busy="true"] .ri{display:inline-block;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- summary ---------- */
  .summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:20px 0 14px}
  .stat{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:11px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;
  }
  .stat .k{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat b{font-size:16px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

  .highlights{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
  .hl{
    position:relative;overflow:hidden;cursor:pointer;text-align:left;
    padding:15px 16px;border-radius:16px;border:1px solid var(--line);
    background:linear-gradient(142deg,rgba(111,140,255,.14),rgba(255,255,255,.03) 58%);
    color:inherit;font:inherit;transition:transform .18s,border-color .18s;
  }
  .hl:hover{transform:translateY(-2px);border-color:rgba(140,165,255,.42)}
  .hl.sway{background:linear-gradient(142deg,rgba(255,107,129,.15),rgba(255,180,84,.07) 58%,rgba(255,255,255,.03))}
  .hl .hl-k{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.01em}
  .hl .hl-t{margin:6px 0 0;font-size:14.5px;font-weight:700;line-height:1.34;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .hl .hl-b{margin-top:9px;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
  .hl .hl-b b{font-size:15px;color:#fff;font-variant-numeric:tabular-nums}
  .hl .hl-sub{font-size:12px;color:var(--muted-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---------- controls ---------- */
  .controls{display:flex;flex-direction:column;gap:11px;margin-bottom:16px}
  .searchbox{position:relative}
  .searchbox .si{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.6;pointer-events:none}
  #search{
    width:100%;padding:12px 40px 12px 38px;border-radius:13px;
    background:rgba(255,255,255,.05);border:1px solid var(--line);
    color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:border-color .18s,background .18s;
  }
  #search::placeholder{color:var(--muted-2)}
  #search:focus{border-color:rgba(120,150,255,.7);background:rgba(255,255,255,.075)}
  .clearbtn{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    width:26px;height:26px;border-radius:50%;border:0;background:rgba(255,255,255,.1);
    color:var(--muted);font-size:13px;cursor:pointer;display:none;place-items:center;
  }
  .clearbtn.on{display:grid}

  .chips,.tabs{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin:0 -18px;padding-left:18px;padding-right:18px}
  .chips::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;padding:8px 13px;border-radius:999px;cursor:pointer;
    border:1px solid var(--line);background:rgba(255,255,255,.035);
    color:#b9c6e6;font-family:inherit;font-size:12.5px;font-weight:600;white-space:nowrap;
    transition:all .16s;
  }
  .chip:hover{background:rgba(255,255,255,.08);color:#fff}
  .chip[aria-pressed="true"]{
    background:linear-gradient(140deg,rgba(110,140,255,.95),rgba(160,110,255,.95));
    border-color:transparent;color:#fff;box-shadow:0 6px 18px -8px rgba(120,130,255,.95);
  }
  .chip .cnt{opacity:.65;font-weight:500;margin-left:4px;font-variant-numeric:tabular-nums}
  .tabs .chip{font-size:13px;padding:9px 14px}

  /* ---------- status line ---------- */
  .statusline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 10px;font-size:12px;color:var(--muted);min-height:18px}
  .statusline .note{color:var(--muted-2);font-size:11.5px}

  /* ---------- grid / cards ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(342px,1fr));gap:12px;align-items:stretch}
  .card{
    background:linear-gradient(168deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
    border:1px solid var(--line);border-radius:var(--radius);
    padding:15px 16px 13px;box-shadow:var(--shadow);
    transition:transform .18s,border-color .18s,box-shadow .18s;
    animation:rise .34s ease both;
    display:flex;flex-direction:column;gap:10px;min-width:0;
  }
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .card:hover{transform:translateY(-2px);border-color:rgba(160,180,255,.34)}
  .card.flash{animation:flash 1.5s ease}
  @keyframes flash{
    0%,100%{box-shadow:var(--shadow)}
    18%{box-shadow:0 0 0 2px rgba(130,160,255,.95),0 0 34px -6px rgba(130,160,255,.75)}
  }
  .card-top{display:flex;align-items:center;gap:7px;min-width:0}
  .badge{
    font-size:10.5px;font-weight:700;padding:3.5px 8px;border-radius:7px;
    white-space:nowrap;letter-spacing:.01em;border:1px solid transparent;
  }
  .badge.econ{color:#ffd88a;background:rgba(255,196,84,.13);border-color:rgba(255,196,84,.24)}
  .badge.pol{color:#9fb6ff;background:rgba(120,150,255,.14);border-color:rgba(120,150,255,.26)}
  .badge.crypto{color:#f6b06a;background:rgba(246,161,74,.13);border-color:rgba(246,161,74,.24)}
  .badge.tech{color:#b79cff;background:rgba(160,120,255,.14);border-color:rgba(160,120,255,.26)}
  .badge.sports{color:#6fe3c0;background:rgba(60,220,180,.12);border-color:rgba(60,220,180,.24)}
  .badge.other{color:#a9b6d4;background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12)}
  .vol24{
    margin-left:auto;font-size:11.5px;font-weight:650;color:#cdd9f5;
    background:rgba(255,255,255,.06);border:1px solid var(--line);
    padding:3px 8px;border-radius:7px;white-space:nowrap;font-variant-numeric:tabular-nums;
  }
  .star{
    flex:0 0 auto;width:28px;height:28px;border-radius:9px;cursor:pointer;
    border:1px solid var(--line);background:rgba(255,255,255,.04);
    color:#5d6a8c;font-size:13px;line-height:1;display:grid;place-items:center;transition:all .16s;
  }
  .star:hover{color:#ffd166;border-color:rgba(255,209,102,.4)}
  .star[aria-pressed="true"]{color:#ffd166;background:rgba(255,209,102,.13);border-color:rgba(255,209,102,.38)}
  .card-title{
    margin:0;font-size:15px;font-weight:720;line-height:1.36;letter-spacing:-.022em;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  }
  .meta{display:flex;flex-wrap:wrap;gap:5px 12px;font-size:11.5px;color:var(--muted);margin-top:-2px}
  .meta span{white-space:nowrap}
  .meta .dot{color:var(--muted-2)}
  .meta .soon{color:var(--warn)}

  .prob-single{display:flex;flex-direction:column;gap:7px;flex:1 1 auto;justify-content:center}
  .prob-head{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
  .pct{font-size:29px;font-weight:800;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
  .pct small{font-size:15px;font-weight:700;margin-left:1px;opacity:.65}
  .pct-label{font-size:11px;color:var(--muted);margin-bottom:4px}
  .chg{
    display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;
    padding:3.5px 8px;border-radius:8px;white-space:nowrap;font-variant-numeric:tabular-nums;
  }
  .chg.up{color:#5ef0be;background:rgba(46,230,168,.12);border:1px solid rgba(46,230,168,.22)}
  .chg.down{color:#ff92a2;background:rgba(255,107,129,.12);border:1px solid rgba(255,107,129,.22)}
  .chg.flat{color:var(--muted);background:rgba(255,255,255,.05);border:1px solid var(--line)}
  .bar{height:9px;border-radius:99px;background:rgba(255,255,255,.075);overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#28d8a0,#4fb3ff);transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .bar-legend{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted-2);font-variant-numeric:tabular-nums}

  .prob-list{display:flex;flex-direction:column;gap:7px}
  .row{display:flex;flex-direction:column;gap:4px}
  .row-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px}
  .row-head .lbl{color:#c8d4ef;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:550}
  .row-head .val{display:flex;align-items:center;gap:6px;flex:0 0 auto;font-variant-numeric:tabular-nums;font-weight:700}
  .row-head .val .c{font-size:10.5px;font-weight:650}
  .c.up{color:#5ef0be}.c.down{color:#ff92a2}.c.flat{color:var(--muted-2)}
  .minibar{height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
  .minibar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#28d8a0,#4fb3ff);transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .more{font-size:11px;color:var(--muted-2);padding-top:1px}
  .swingline{
    display:flex;align-items:center;gap:6px;font-size:11.5px;color:#ffc48a;
    background:rgba(255,180,84,.08);border:1px solid rgba(255,180,84,.18);
    padding:5px 9px;border-radius:9px;overflow:hidden;
  }
  .swingline b{color:#ffd9a8;font-weight:700;white-space:nowrap}
  .swingline span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#dcc4a6}

  .actions{display:flex;gap:6px;margin-top:auto;padding-top:2px}
  .btn{
    font-family:inherit;font-size:11.5px;font-weight:650;cursor:pointer;
    border-radius:10px;padding:8px 10px;border:1px solid var(--line);
    background:rgba(255,255,255,.045);color:#c3cfec;
    display:inline-flex;align-items:center;justify-content:center;gap:5px;
    transition:all .16s;white-space:nowrap;text-decoration:none;min-width:0;
  }
  .btn:hover{background:rgba(255,255,255,.1);color:#fff;border-color:var(--line-strong)}
  .btn:active{transform:scale(.97)}
  .btn.copy{flex:1 1 auto;background:linear-gradient(140deg,rgba(110,140,255,.22),rgba(160,110,255,.18));border-color:rgba(140,150,255,.3);color:#dfe6ff}
  .btn.copy:hover{background:linear-gradient(140deg,rgba(110,140,255,.34),rgba(160,110,255,.28))}
  .btn.open{flex:0 0 auto}
  .btn[aria-pressed="true"]{background:rgba(255,209,102,.16);border-color:rgba(255,209,102,.34);color:#ffdd8f}

  /* ---------- states ---------- */
  .skeleton{border-radius:var(--radius);border:1px solid var(--line);background:linear-gradient(168deg,rgba(255,255,255,.04),rgba(255,255,255,.012));padding:16px;overflow:hidden;position:relative;height:186px}
  .skeleton::after{
    content:"";position:absolute;inset:0;transform:translateX(-100%);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);
    animation:shimmer 1.35s infinite;
  }
  @keyframes shimmer{to{transform:translateX(100%)}}
  .sk-line{height:11px;border-radius:6px;background:rgba(255,255,255,.07);margin-bottom:9px}
  .sk-line.w40{width:40%}.sk-line.w70{width:70%}.sk-line.w90{width:90%}

  .state{
    grid-column:1/-1;text-align:center;padding:52px 22px;border-radius:20px;
    border:1px dashed rgba(255,255,255,.14);background:rgba(255,255,255,.02);
  }
  .state .ico{font-size:32px;margin-bottom:10px}
  .state h3{margin:0 0 6px;font-size:15.5px;font-weight:700}
  .state p{margin:0 auto 16px;font-size:12.5px;color:var(--muted);max-width:420px;line-height:1.6}
  .state .retry{
    padding:10px 20px;border-radius:11px;border:0;cursor:pointer;font-family:inherit;
    font-weight:700;font-size:13px;color:#fff;
    background:linear-gradient(140deg,#4d6bff,#9b5cff);box-shadow:0 8px 20px -10px rgba(120,120,255,.95);
  }
  .state .retry:active{transform:scale(.97)}

  footer.foot{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted-2);display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:space-between}

  /* ---------- toast / fallback ---------- */
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,26px);
    background:rgba(24,32,54,.96);border:1px solid rgba(255,255,255,.16);
    color:#eaf0ff;font-size:13px;font-weight:600;padding:11px 18px;border-radius:12px;
    box-shadow:0 20px 44px -18px rgba(0,0,0,.9);opacity:0;pointer-events:none;
    transition:opacity .22s,transform .22s;z-index:90;max-width:calc(100vw - 40px);text-align:center;
    backdrop-filter:blur(10px);
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .sheet{
    position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:20px;
    background:rgba(4,7,14,.7);backdrop-filter:blur(6px);
  }
  .sheet.on{display:grid}
  .sheet-box{width:100%;max-width:460px;background:#111a2e;border:1px solid var(--line-strong);border-radius:16px;padding:16px}
  .sheet-box h4{margin:0 0 6px;font-size:14px}
  .sheet-box p{margin:0 0 10px;font-size:12px;color:var(--muted)}
  .sheet-box textarea{
    width:100%;height:110px;border-radius:10px;border:1px solid var(--line);
    background:rgba(255,255,255,.05);color:#eaf0ff;font-family:inherit;font-size:12.5px;padding:10px;resize:none;line-height:1.5;
  }
  .sheet-box .row2{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
  .sheet-box button{font-family:inherit;font-size:12.5px;font-weight:650;padding:8px 16px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:#dfe6ff;cursor:pointer}

  @media (max-width:760px){
    .wrap{padding:0 14px 44px}
    .topbar-in{padding:11px 14px;gap:10px}
    .brand h1{font-size:15.5px}
    .brand p{font-size:10.5px}
    .logo{width:34px;height:34px;flex-basis:34px;font-size:17px;border-radius:11px}
    .summary{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0 12px}
    .stat{padding:9px 11px;border-radius:12px}
    .stat b{font-size:14px}
    .stat .k{font-size:10.5px}
    .highlights{grid-template-columns:1fr;gap:9px}
    .hl{padding:13px 14px}
    .hl .hl-t{font-size:13.5px}
    .chips,.tabs{margin:0 -14px;padding-left:14px;padding-right:14px}
    .grid{grid-template-columns:1fr;gap:10px}
    .pct{font-size:26px}
    .card{padding:14px 14px 12px;border-radius:16px}
    .btn{font-size:11px;padding:8px 8px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important;transition-duration:.001ms !important}
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo" aria-hidden="true">🌐</div>
      <div>
        <h1>세상물정 스캐너</h1>
        <p>Polymarket 실시간 이슈 · 확률 · 거래량</p>
      </div>
    </div>
    <div class="topbar-right">
      <div class="updated">마지막 갱신<b id="updatedTime">–</b></div>
      <button class="iconbtn" id="refreshBtn" type="button" aria-label="새로고침" title="새로고침">
        <span class="ri" aria-hidden="true">⟳</span>
      </button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="summary" aria-label="요약">
    <div class="stat"><span class="k">이슈</span><b id="statEvents">–</b></div>
    <div class="stat"><span class="k">24h 거래</span><b id="statVol">–</b></div>
    <div class="stat"><span class="k">관심 저장</span><b id="statFav">0</b></div>
  </section>

  <div class="highlights" id="highlights" aria-label="하이라이트"></div>

  <section class="controls">
    <div class="searchbox">
      <span class="si" aria-hidden="true">🔍</span>
      <input id="search" type="search" inputmode="search" placeholder="키워드 검색 (예: 비트코인, Fed, 대선)" aria-label="키워드 검색" autocomplete="off">
      <button class="clearbtn" id="clearSearch" type="button" aria-label="검색어 지우기">✕</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="카테고리 필터"></div>
    <div class="tabs" id="tabs" role="tablist" aria-label="정렬"></div>
  </section>

  <div class="statusline">

  /* ================= 유틸 ================= */
  function esc(s) {

      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function num(v) {
    if (v === null || v === undefined || v === '') return null;
    var n = typeof v === 'number' ? v : parseFloat(v);
    return isFinite(n) ? n : null;
  }
  function parseArr(v) {
    if (Array.isArray(v)) return v;
    if (typeof v === 'string') {
      try { var a = JSON.parse(v); return Array.isArray(a) ? a : null; } catch (e) { return null; }
    }
    return null;
  }
  function money(v) {
    var n = num(v);
    if (n === null) return '—';
    if (n >= 1e9) return '$' + (n / 1e9).toFixed(n >= 1e10 ? 1 : 2) + 'B';
    if (n >= 1e6) return '$' + (n / 1e6).toFixed(n >= 1e7 ? 1 : 2) + 'M';
    if (n >= 1e3) return '$' + (n / 1e3).toFixed(n >= 1e4 ? 0 : 1) + 'K';
    return '$' + Math.round(n);
  }
  function pctText(p) {
    if (p === null || p === undefined) return '—';

    if (v > 0 && v < 1) return v.toFixed(1) + '%';
    if (v >= 99.94) return '100%';
    return Math.round(v) + '%';
  }
  function chgText(c) {
    if (c === null || c === undefined) return null;
    var v = c * 100;
    var sign = v > 0 ? '+' : (v < 0 ? '-' : '');
    return sign + Math.abs(v).toFixed(1) + '%p';
  }
  function chgClass(c) {
    if (c === null || c === undefined || Math.abs(c) < 0.00005) return 'flat';
    return c > 0 ? 'up' : 'down';
  }
  function chgArrow(c) {
    if (c === null || c === undefined || Math.abs(c) < 0.00005) return '—';
    return c > 0 ? '▲' : '▼';
  }
  function chgBadgeHtml(c) {
    if (c === null || c === undefined) return '<span class="chg flat">24h 변동 없음</span>';
    return '<span class="chg ' + chgClass(c) + '">' + chgArrow(c) + ' ' + chgText(c) + '</span>';
  }
  function priceText(v) {
    var n = num(v);
    if (n === null) return '—';
    if (n >= 1000) return '$' + n.toLocaleString('en-US', { maximumFractionDigits: 0 });
    if (n >= 1) return '$' + n.toFixed(2);
    return '$' + n.toFixed(4).replace(/0+$/, '').replace(/\.$/, '');
  }
  function endInfo(iso) {
    if (!iso) return { text: '마감 미정', soon: false };
    var d = new Date(iso);
    if (isNaN(d.getTime())) return { text: '마감 미정', soon: false };
    var md = d.toLocaleDateString('ko-KR', { timeZone: 'Asia/Seoul', month: 'long', day: 'numeric' });
    var days = Math.ceil((d.getTime() - Date.now()) / 86400000);
    if (days < 0) return { text: md + ' 마감', soon: false, past: true };
    if (days === 0) return { text: md + ' 마감 (오늘)', soon: true };
    if (days > 365) return { text: md + ' 마감', soon: false };
    return { text: md + ' 마감 · D-' + days, soon: days <= 3 };
  }

  /* ================= 분류 ================= */
  function classify(tags, title) {
    var score = { econ: 0, politics: 0, crypto: 0, tech: 0, sports: 0 };
    (tags || []).forEach(function (t) {
      var keys = [];
      if (t && typeof t === 'object') {
        if (t.label) keys.push(String(t.label).toLowerCase());
        if (t.slug) keys.push(String(t.slug).toLowerCase());
      } else if (typeof t === 'string') { keys.push(t.toLowerCase()); }
      keys.forEach(function (k) {
        Object.keys(TAGS).forEach(function (c) {
          if (Object.prototype.hasOwnProperty.call(TAGS[c], k)) score[c] += TAGS[c][k];
        });
      });
    });
    var low = ' ' + String(title || '').toLowerCase() + ' ';
    Object.keys(TITLE_WORDS).forEach(function (c) {
      TITLE_WORDS[c].forEach(function (pair) {
        if (low.indexOf(pair[0]) >= 0) score[c] += pair[1];
      });
    });
    var best = 'other', bestScore = 0;
    ['econ', 'politics', 'crypto', 'tech', 'sports'].forEach(function (c) {
      if (score[c] > bestScore) { bestScore = score[c]; best = c; }
    });
    return bestScore > 0 ? best : 'other';
  }
  function catGroup(cat) {
    if (cat === 'other') return 'other';
    return cat === 'politics' ? 'pol' : cat;
  }

  /* ================= 데이터 정규화 ================= */
  function normMarket(m) {
    var outs = parseArr(m && m.outcomes);
    var prices = parseArr(m && m.outcomePrices);
    if (!outs || !prices || outs.length !== prices.length || outs.length < 2) return null;
    var nums = prices.map(num);
    if (nums.some(function (n) { return n === null; })) return null;
    var yesIdx = -1;
    for (var i = 0; i < outs.length; i++) {
      if (String(outs[i]).trim().toLowerCase() === 'yes') { yesIdx = i; break; }
    }
    if (yesIdx < 0) yesIdx = 0;
    var label = (m.groupItemTitle || m.question || '').trim();
    if (!label) return null;
    return {
      label: label,
      question: (m.question || '').trim(),
      yes: Math.max(0, Math.min(1, nums[yesIdx])),
      change: num(m.oneDayPriceChange),
      vol24: num(m.volume24hr) || 0,
      volume: num(m.volume) || 0,
      closed: !!m.closed
    };
  }

  function normEvent(e) {
    if (!e || !e.title) return null;
    var markets = [];
    (e.markets || []).forEach(function (m) {
      if (!m || m.closed || m.active === false) return;
      var nm = normMarket(m);
      if (nm) markets.push(nm);
    });
    if (!markets.length) return null;
    markets.sort(function (a, b) { return b.yes - a.yes; });

    var top = markets[0];
    var swing = null;
    markets.forEach(function (m) {
      if (m.change === null || m.change === undefined) return;
      if (!swing || Math.abs(m.change) > Math.abs(swing.change)) swing = m;
    });

    var tags = (e.tags || []).map(function (t) {
      return t && typeof t === 'object' ? (t.label || t.slug || '') : String(t || '');
    }).filter(Boolean);

    var category = classify(e.tags, e.title + ' ' + markets.slice(0, 4).map(function (m) { return m.question; }).join(' '));
    return {
      id: String(e.id || e.slug || e.title),

      category: category,

  function copyText(text) {
    return new Promise(function (resolve) {
      var done = function (ok) { resolve(!!ok); };
      try {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(function () { done(true); }, function () { fallback(); });
          return;
        }
      } catch (e) { /* fallthrough */ }
      fallback();
      function fallback() {
        try {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, text.length);
          var ok = document.execCommand('copy');
          document.body.removeChild(ta);
          done(ok);
        } catch (e2) { done(false); }
      }
    });
  }

  function matchesQuery(ev, q) {
    if (!q) return true;
    var hay = (ev.title + ' ' + ev.tags.join(' ') + ' ' +
      ev.markets.slice(0, 6).map(function (m) { return m.question + ' ' + m.label; }).join(' ')).toLowerCase();
    return q.toLowerCase().split(/\s+/).filter(Boolean).every(function (w) {
      var alts = ALIAS[w] ? [w].concat(ALIAS[w]) : [w];
      return alts.some(function (a) { return a && hay.indexOf(a) >= 0; });
    });
  }

  function visibleEvents() {
    var list;
    if (state.sort === 'fav') {
      list = state.favorites.map(function (f) {
        var live = state.events.filter(function (e) { return e.id === f.id; })[0];
        return live || favToEvent(f);
      }).filter(Boolean);
      if (state.cat !== 'all') list = list.filter(function (e) { return e.category === state.cat; });
      if (state.q) list = list.filter(function (e) { return matchesQuery(e, state.q); });
      return list;
    }
    list = state.events.slice();
    if (state.cat !== 'all') list = list.filter(function (e) { return e.category === state.cat; });
    if (state.q) list = list.filter(function (e) { return matchesQuery(e, state.q); });
    if (state.sort === 'hot') list.sort(function (a, b) { return b.vol24 - a.vol24; });
    else if (state.sort === 'volume') list.sort(function (a, b) { return b.volume - a.volume; });
    else if (state.sort === 'swing') {
      list.sort(function (a, b) {
        var av = a.swing ? Math.abs(a.swing.change) : -1;
        var bv = b.swing ? Math.abs(b.swing.change) : -1;
        return bv - av;
      });
    }
    return list;
  }

  function favToEvent(f) {
    var label = 'Yes';
    var mk = { label: label, question: f.title, yes: f.topProb == null ? 0 : f.topProb, change: f.change, vol24: f.vol24 || 0, volume: f.volume || 0 };
    return {
      id: f.id, slug: f.slug, title: f.title, tags: [], category: f.category || 'other',
      markets: [mk], top: mk, swing: (f.change == null ? null : mk),
      vol24: f.vol24 || 0, volume: f.volume || 0, endDate: f.endDate || null, snapshotOnly: true
    };
  }

    state.events.forEach(function (e) { counts[e.category] = (counts[e.category] || 0) + 1; });
    el.chips.innerHTML = CATEGORIES.map(function (c) {
      var n = c.id === 'all' ? state.events.length : (counts[c.id] || 0);
      return '<button type="button" class="chip" data-cat="' + c.id + '" aria-pressed="' +
        (state.cat === c.id) + '">' + esc(c.label) + '<span class="cnt">' + n + '</span></button>';
    }).join('');
  }

  function renderTabs() {
    var counts = { hot: state.events.length, swing: state.events.filter(function (e) { return e.swing; }).length,
                   volume: state.events.length, fav: state.favorites.length };
    el.tabs.innerHTML = SORTS.map(function (s) {
      return '<button type="button" class="chip" role="tab" data-sort="' + s.id + '" aria-selected="' +
        (state.sort === s.id) + '" aria-pressed="' + (state.sort === s.id) + '">' + s.label +
        '<span class="cnt">' + (counts[s.id] || 0) + '</span></button>';
    }).join('');
  }

  function renderHighlights() {
    if (!state.events.length) { el.highlights.innerHTML = ''; return; }
    var byVol = state.events.slice().sort(function (a, b) { return b.vol24 - a.vol24; })[0];
    var bySwing = null;
    state.events.forEach(function (e) {
      if (!e.swing) return;
      if (!bySwing || Math.abs(e.swing.change) > Math.abs(bySwing.swing.change)) bySwing = e;
    });
    var html = '';
    if (byVol) {
      html += '<button type="button" class="hl" data-jump="' + esc(byVol.id) + '">' +
        '<div class="hl-k">🏆 24시간 거래량 1위</div>' +
        '<p class="hl-t">' + esc(byVol.title) + '</p>' +
        '<div class="hl-b"><b>' + money(byVol.vol24) + '</b><span>24시간</span>' +
        '<span class="chg ' + chgClass(byVol.top.change) + '">' + chgArrow(byVol.top.change) + ' ' +
        (byVol.top.change === null ? '변동 없음' : chgText(byVol.top.change)) + '</span></div>' +
        '<div class="hl-sub">' + esc(pctText(byVol.top.yes)) +
        (byVol.top.label && byVol.top.label !== byVol.title ? ' · ' + esc(byVol.top.label) : '') + '</div>' +
        '</button>';
    }
    if (bySwing) {
      html += '<button type="button" class="hl sway" data-jump="' + esc(bySwing.id) + '">' +
        '<div class="hl-k">⚡ 오늘 최대 급변동</div>' +
        '<p class="hl-t">' + esc(bySwing.title) + '</p>' +
        '<div class="hl-b"><b class="chg ' + chgClass(bySwing.swing.change) + '" style="background:none;border:0;padding:0;font-size:19px">' +
        chgArrow(bySwing.swing.change) + ' ' + chgText(bySwing.swing.change) + '</b>' +
        '<span>' + esc(pctText(bySwing.swing.yes)) + '까지 ' + (bySwing.swing.change > 0 ? '상승' : '하락') + '</span></div>' +
        '<div class="hl-sub">' + (bySwing.swing.label && bySwing.swing.label !== bySwing.title
          ? esc(bySwing.swing.label) : '현재 확률 ' + esc(pctText(bySwing.swing.yes)) + ' 기준') + '</div>' +
        '</button>';
    }
    el.highlights.innerHTML = html;
  }

  function marketRowHtml(m) {
    var w = Math.max(1, Math.round(m.yes * 100));
    var c = m.change;
    var cHtml = c === null || c === undefined ? '<span class="c flat">–</span>'
      : '<span class="c ' + chgClass(c) + '">' + chgArrow(c) + Math.abs(c * 100).toFixed(1) + '</span>';
    return '<div class="row">' +
      '<div class="row-head"><span class="lbl" title="' + esc(m.question) + '">' + esc(m.label) + '</span>' +
      '<span class="val"><span>' + pctText(m.yes) + '</span>' + cHtml + '</span></div>' +
      '<div class="minibar"><i style="width:' + w + '%"></i></div>' +
      '</div>';
  }

  function probHtml(ev) {
    var ms = ev.markets;
    if (ms.length === 1) {
      var m = ms[0];
      var w = Math.max(1, Math.round(m.yes * 100));
      return '<div class="prob-single">' +
        '<div class="prob-head">' +
        '<div><div class="pct">' + pctText(m.yes).replace('%', '') + '<small>%</small></div>' +
        '<div class="pct-label">' + (m.label && m.label !== ev.title ? esc(m.label) : 'Yes 확률') + '</div></div>' +
        chgBadgeHtml(m.change) +
        '</div>' +
        '<div class="bar"><i style="width:' + w + '%"></i></div>' +
        '<div class="bar-legend"><span>Yes ' + pctText(m.yes) + '</span><span>No ' + pctText(1 - m.yes) + '</span></div>' +
        '</div>';
    }
    var shown = ms.slice(0, 4);
    var rest = ms.length - shown.length;
    return '<div class="prob-list">' + shown.map(marketRowHtml).join('') +
      (rest > 0 ? '<div class="more">외 ' + rest + '개 후보 · 총 ' + ms.length + '개</div>' : '') +
      '</div>';
  }

  function cardHtml(ev, idx) {
    var end = endInfo(ev.endDate);
    var fav = isFav(ev.id);
    var swingLine = (state.sort === 'swing' && ev.swing) ?
      '<div class="swingline">⚡ 급변동 <b>' + chgArrow(ev.swing.change) + ' ' + chgText(ev.swing.change) + '</b>' +
      '<span class="t">' + esc(ev.swing.label) + ' → ' + pctText(ev.swing.yes) + '</span></div>' : '';
    return '<article class="card" data-id="' + esc(ev.id) + '">' +
      '<div class="card-top">' +
      '<span class="badge ' + catGroup(ev.category) + '">' + CAT_LABEL[ev.category] + '</span>' +
      '<span class="vol24" title="24시간 거래량">24h ' + money(ev.vol24) + '</span>' +
      '<button type="button" class="star" data-act="fav" aria-pressed="' + fav + '" aria-label="관심 저장">' + (fav ? '★' : '☆') + '</button>' +
      '</div>' +
      '<h3 class="card-title">' + esc(ev.title) + '</h3>' +
      '<div class="meta">' +
      '<span>누적 ' + money(ev.volume) + '</span>' +
      '<span class="dot">·</span>' +
      '<span class="' + (end.soon ? 'soon' : '') + '">' + esc(end.text) + '</span>' +
      (ev.markets.length > 1 ? '<span class="dot">·</span><span>후보 ' + ev.markets.length + '개</span>' : '') +
      '</div>' +
      swingLine +
      probHtml(ev) +
      '<div class="actions">' +
      '<button type="button" class="btn" data-act="fav" aria-pressed="' + fav + '">' + (fav ? '★ 저장됨' : '☆ 관심') + '</button>' +
      '<button type="button" class="btn copy" data-act="copy">💬 피클 질문 복사</button>' +
      (ev.slug ? '<a class="btn open" href="' + 'https://polymarket.com/event/' + encodeURIComponent(ev.slug) + '" target="_blank" rel="noopener noreferrer">🔗 원문</a>' : '') +
      '</div>' +
      '</article>';
  }

  function render() {
    renderChips();
    renderTabs();
    renderHighlights();

    var list = visibleEvents();
    el.statEvents.textContent = String(state.events.length || 0);
    var total24 = state.events.reduce(function (s, e) { return s + (e.vol24 || 0); }, 0);
    el.statVol.textContent = money(total24);
    el.statFav.textContent = String(state.favorites.length);

    if (state.loading && !state.events.length) {
      el.grid.innerHTML = Array.apply(null, Array(6)).map(function () {
        return '<div class="skeleton"><div class="sk-line w40"></div><div class="sk-line w90"></div>' +
          '<div class="sk-line w70"></div><div class="sk-line w90"></div><div class="sk-line w40"></div></div>';
      }).join('');
      el.resultLine.textContent = '폴리마켓에서 최신 이슈를 가져오는 중…';
      el.noteLine.textContent = '';
      return;
    }
    if (state.error && !state.events.length) {
      el.grid.innerHTML = '<div class="state"><div class="ico">📡</div><h3>데이터를 불러오지 못했어요</h3>' +
        '<p>' + esc(state.error) + '<br>네트워크 연결이나 광고 차단 프로그램을 확인한 뒤 다시 시도해 주세요.</p>' +
        '<button type="button" class="retry" data-act="retry">다시 시도</button></div>';
      el.resultLine.textContent = '오류';
      return;
    }
    if (!list.length) {
      var msg = state.sort === 'fav' ? ['⭐', '아직 저장한 이슈가 없어요', '카드의 ☆ 관심 버튼을 누르면 여기에 모여요.']
        : ['🔎', '조건에 맞는 이슈가 없어요', '검색어나 카테고리를 바꿔 보세요.'];
      el.grid.innerHTML = '<div class="state"><div class="ico">' + msg[0] + '</div><h3>' + msg[1] + '</h3><p>' + msg[2] + '</p></div>';
      el.resultLine.textContent = '0개';
      return;
    }
    el.grid.innerHTML = list.map(cardHtml).join('');
    el.resultLine.innerHTML = '<b style="color:#dbe4ff;font-weight:700">' + list.length + '개</b> 이슈' +
      (state.q ? ' · “' + esc(state.q) + '”' : '') +
      (state.sort === 'fav' && list.some(function (e) { return e.snapshotOnly; }) ? ' <span class="note">(저장 시점 기준 일부 표시)</span>' : '');
    el.noteLine.textContent = state.lastLoaded ? '갱신 ' + state.lastLoaded.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) : '';
  }

  /* ================= 데이터 로드 ================= */
  function buildUrl(limit) {
    var p = new URLSearchParams();
    Object.keys(BASE_PARAMS).forEach(function (k) { p.set(k, BASE_PARAMS[k]); });
    p.set('limit', String(limit));
    return API + '?' + p.toString();
  }
  function buildKeysetUrl(limit) {
    var p = new URLSearchParams();
    Object.keys(BASE_PARAMS).forEach(function (k) { p.set(k, BASE_PARAMS[k]); });
    p.set('limit', String(limit));
    return API_KEYSET + '?' + p.toString();
  }

  function fetchJson(url) {
    var ctrl = ('AbortController' in window) ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 15000);
    return fetch(url, { headers: { 'Accept': 'application/json' }, signal: ctrl ? ctrl.signal : undefined })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (j) { clearTimeout(timer); return j; }, function (e) { clearTimeout(timer); throw e; });
  }

  function load() {
    if (state.loading) return;
    state.loading = true;
    state.error = null;
    el.refreshBtn.setAttribute('aria-busy', 'true');
    if (state.events.length) render();

    function attempt(url) {
      return fetchJson(url).then(function (json) {
        var arr = Array.isArray(json) ? json
          : (json && Array.isArray(json.events) ? json.events : null);
        if (!arr || !arr.length) throw new Error('empty');
        return arr;
      });
    }

    attempt(buildUrl(60))
      .catch(function () { return attempt(buildUrl(50)); })
      .catch(function () { return attempt(buildKeysetUrl(60)); })
      .then(function (json) {
        var events = [];
        json.forEach(function (e) {
          var n = normEvent(e);
          if (n) events.push(n);
        });
        if (!events.length) throw new Error('no-parseable');
        state.events = events;
        state.lastLoaded = new Date();
        el.updatedTime.textContent = state.lastLoaded.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
        state.error = null;
      })
      .catch(function (err) {
        state.error = (err && err.message === 'HTTP 429')
          ? '요청이 잠시 제한되었어요. 1분 뒤 다시 시도해 주세요.'
          : '폴리마켓 API에 연결하지 못했어요.';
        if (state.events.length) toast('갱신 실패 · 기존 데이터를 보여드려요');
      })
      .then(function () {
        state.loading = false;
        el.refreshBtn.removeAttribute('aria-busy');
        render();
      });
  }

  /* ================= 이벤트 ================= */
  el.chips.addEventListener('click', function (e) {
    var b = e.target.closest('[data-cat]');
    if (!b) return;
    state.cat = b.getAttribute('data-cat');
    render();
  });
  el.tabs.addEventListener('click', function (e) {
    var b = e.target.closest('[data-sort]');
    if (!b) return;
    state.sort = b.getAttribute('data-sort');
    render();
  });
  el.search.addEventListener('input', function () {
    state.q = el.search.value.trim();
    el.clearSearch.classList.toggle('on', !!state.q);
    render();
  });
  el.clearSearch.addEventListener('click', function () {
    el.search.value = '';
    state.q = '';
    el.clearSearch.classList.remove('on');
    el.search.focus();
    render();
  });
  el.refreshBtn.addEventListener('click', function () { load(); });

  el.highlights.addEventListener('click', function (e) {
    var b = e.target.closest('[data-jump]');
    if (!b) return;
    var id = b.getAttribute('data-jump');
    var target = state.events.filter(function (x) { return x.id === id; })[0];
    if (!target) return;
    if (state.cat !== 'all' && target.category !== state.cat) state.cat = 'all';
    if (state.sort === 'fav') state.sort = 'hot';
    if (state.q) { state.q = ''; el.search.value = ''; el.clearSearch.classList.remove('on'); }
    render();
    var card = el.grid.querySelector('[data-id="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"]');
    if (card) {
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      card.classList.add('flash');
      setTimeout(function () { card.classList.remove('flash'); }, 1600);
    }
  });

  el.grid.addEventListener('click', function (e) {
    var actEl = e.target.closest('[data-act]');
    if (!actEl) return;
    var act = actEl.getAttribute('data-act');
    if (act === 'retry') { load(); return; }
    var card = actEl.closest('.card');
    if (!card) return;
    var id = card.getAttribute('data-id');
    var ev = state.events.filter(function (x) { return x.id === id; })[0];
    if (!ev && state.sort === 'fav') {
      var f = state.favorites.filter(function (x) { return x.id === id; })[0];
      if (f) ev = favToEvent(f);
    }
    if (!ev) return;

    if (act === 'fav') { toggleFav(ev); return; }
    if (act === 'copy') {
      var text = questionText(ev);
      copyText(text).then(function (ok) {
        if (ok) toast('💬 피클 질문을 복사했어요');
        else { showSheet(text); toast('직접 복사해 주세요'); }
      });
    }
  });

  el.sheetClose.addEventListener('click', function () { el.sheet.classList.remove('on'); });
  el.sheet.addEventListener('click', function (e) { if (e.target === el.sheet) el.sheet.classList.remove('on'); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') el.sheet.classList.remove('on'); });

  /* 자동 갱신 */
  setInterval(function () {
    if (document.hidden) return;
    load();
  }, AUTO_REFRESH_MS);

  /* 시작 */
  render();
  load();
})();
</script>
</body>
</html>
