<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>390 미리보기</title>
<style>
  html,body{margin:0;padding:0;background:#05070f;display:flex;justify-content:center}
  iframe{width:390px;height:844px;border:0;display:block;background:#0b0f19}
</style>
</head>
<body>
<iframe id="f" src="./index.html" title="390x844 미리보기"></iframe>
<script>
  document.getElementById('f').addEventListener('load', function () {
    try {
      var d = this.contentDocument;
      var btns = d.querySelectorAll('#tabbar button, #tabbar a');
      for (var i = 0; i < btns.length; i++) {
        if ((btns[i].textContent || '').indexOf('램') >= 0) { btns[i].click(); break; }
      }
      var m = /[?&]y=(\d+)/.exec(location.search || '');
      if (m) {
        var top = parseInt(m[1], 10), self = this;
        setTimeout(function () { self.contentWindow.scrollTo(0, top); }, 700);
      }
    } catch (e) { /* 미리보기용 */ }
  });
</script>
</body>
</html>
