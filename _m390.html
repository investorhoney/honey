<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>390 미리보기</title>
<style>
  html,body{margin:0;padding:0;background:#05070f}
  #row{display:flex;gap:8px;justify-content:center;align-items:flex-start}
  iframe{width:390px;height:844px;border:0;display:block;background:#0b0f19;flex:0 0 auto}
</style>
</head>
<body>
<div id="row"></div>
<script>
  (function () {
    var q = /[?&]y=([\d,]+)/.exec(location.search || '');
    var list = q ? q[1].split(',').map(function (v) { return parseInt(v, 10) || 0; }) : [0];
    var row = document.getElementById('row');
    list.forEach(function (y, i) {
      var f = document.createElement('iframe');
      f.id = 'p' + i;
      f.src = './index.html';
      f.title = '390x844 미리보기 ' + y;
      f.addEventListener('load', function () {
        try {
          var d = f.contentDocument;
          var btns = d.querySelectorAll('#tabbar button, #tabbar a');
          for (var k = 0; k < btns.length; k++) {
            if ((btns[k].textContent || '').indexOf('램') >= 0) { btns[k].click(); break; }
          }
          setTimeout(function () { f.contentWindow.scrollTo(0, y); }, 900);
        } catch (e) { /* 미리보기용 */ }
      });
      row.appendChild(f);
    });
  })();
</script>
</body>
</html>
